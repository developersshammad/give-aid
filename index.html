 amount, and follow exactly where it goes.",body:"Give-AID was set up with the support of leading companies so that every rupee donated reaches the people who need it most."},{id:2,slug:"what-we-do",section:"About",order:1,title:"What we do",subtitle:"One platform, many NGOs, one promise: your donation goes where you choose.",body:`Give-AID is a non-governmental umbrella organisation. We do not replace local NGOs - we connect them with donors, volunteers and companies who want to help.

## Raising funds
We run donation drives, charity events and corporate giving programmes. Every donor chooses a cause, and the money is released only to NGOs working on that cause.

## Running programmes
Together with our partner NGOs we organise:
- Free schools and scholarship schemes
- Medical and eye camps in low-income areas
- Therapy and learning centres for specially challenged children
- Skills training for women and young people
- Day-care and health checks for the elderly

## Reporting back
Every programme publishes photos, spending and results in our gallery and annual report.`},{id:3,slug:"our-mission",section:"About",order:2,title:"Our mission",subtitle:"A dignified life for every person, whatever they were born into.",body:`Our mission is to make giving simple, transparent and effective, so that help reaches children, women, the disabled, young people and the elderly without delay.

## Our values
- Transparency: donors can see which cause and programme their money supports.
- Dignity: we work with communities, not for them.
- Partnership: we strengthen local NGOs instead of competing with them.
- Accountability: accounts are audited every year by an independent firm.`},{id:4,slug:"our-team",section:"About",order:3,title:"Our team",subtitle:"A small staff, a large circle of volunteers.",body:`## Board of trustees
- Dr. Sameena Qureshi - Chairperson, paediatrician
- Mr. Faisal Ahmed - Treasurer, chartered accountant
- Ms. Nadia Hussain - Trustee, education specialist

## Management
- Omar Siddiqui - Executive Director
- Hira Baig - Head of Programmes
- Kamran Ali - Partnerships & Fundraising
- Sana Mirza - Volunteer Coordinator

More than 400 volunteers help us every year at camps, schools and events.`},{id:5,slug:"careers",section:"About",order:4,title:"Career with us",subtitle:"Work where your skills count twice.",body:`We look for people who care about results as much as about causes.

## Current openings
- Programme Officer (Education) - Karachi, full time
- Field Coordinator (Health Camps) - Lahore, full time
- Communications Intern - remote, 3 months

## How to apply
Send your CV and a short cover letter to careers@giveaid.org with the job title in the subject line. Shortlisted candidates are contacted within two weeks.`},{id:6,slug:"achievements",section:"About",order:5,title:"Our achievements",subtitle:"What our donors made possible.",body:`- 12,000+ children kept in school through scholarships
- 38 free medical and eye camps held in the last year
- 1,150 wheelchairs and hearing aids distributed
- 2,400 women trained in tailoring, IT and small business
- 6 day-care centres opened for senior citizens

## Recognition
Give-AID received the National Philanthropy Award for transparency in 2024.`},{id:7,slug:"supporters",section:"About",order:6,title:"Our supporters",subtitle:"Individuals, families and companies who give regularly.",body:`Thousands of people give to Give-AID every month - students who give a hundred rupees, families who give their Zakat and Sadaqah, and companies who match their employees' donations.

Our founding corporate supporters helped us set up the platform and still cover all administration costs, so that public donations go fully to programmes.

See the Our Partners page for the companies that support us.`},{id:8,slug:"read-about-us",section:"About",order:7,title:"Read about us",subtitle:"News, reports and stories.",body:`## In the news
- Give-AID's winter drive delivers 5,000 blankets in Karachi and Quetta
- Local NGOs join hands on a single donation platform
- Eye camp in Thar screens 1,200 patients in three days

## Reports
Our annual report and audited accounts are available on request from info@giveaid.org.`},{id:9,slug:"help-centre",section:"Help",order:8,title:"Help Centre",subtitle:"Answers to common questions. Can't find yours? Ask us below.",body:`## How do I donate?
Open Donate, choose a cause, enter the amount and your card details. You receive a receipt with a transaction number immediately.

## Is my card information safe?
We never store your full card number or CVV. Only the last four digits are kept for your receipt.

## Do I need an account?
No. Guests can donate too, but registered members can see their donation history, invite friends and join programmes faster.

## Can I choose where my money goes?
Yes. Every donation is linked to the cause you pick and is used only for that cause.

## How can I volunteer?
Open any upcoming programme and use the 'I want to take part' form.`},{id:10,slug:"contact-us",section:"Contact",order:9,title:"Contact us",subtitle:"We usually reply within one working day.",body:`## Head office
